<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> CHAI AUR CODE ! </title>
</head>
<body style="background-color: #212121; color: #fff;">
    <ul class="language">
        <li>javscript</li>
    </ul>
    </body>

    <script>
        function addElement(langName){
            const li = document.createElement('li')
            li.innerHTML = `${langName}`
            document.querySelector('.language ').append(li)

        }
        addElement("python")
        addElement("typescript")
        function langOptimized(langName){//THIS SI THE OPTIMIZED WAY OF 
            // ADD ELEMNT IN THE LIST BY APPENDCHILD CREATE TEXT NODE THEN DOCUMENT
            const li = document.createElement('li')
            li.appendChild(document.createTextNode(langName))
            document.querySelector('.language ').append(li)

        }
        langOptimized(" REACT ")
        langOptimized(" C++ ")

        // EDIT 

        const secondLang = document.querySelector("li:nth-child(3)")
        // secondLang.innerHTML = " MOJO "
        const newLi = document.createElement('li')
        newLi.textContent = " SWIFT "
        secondLang.replaceWith(newLi)
        </script>

</html>
